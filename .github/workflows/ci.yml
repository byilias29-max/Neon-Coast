name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintaxis de los scripts
        run: |
          set -e
          for f in $(find . -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -not -path './vendor/*'); do
            node --check "$f"
          done
          echo "JS OK"

      - name: El script inline de index.html es valido
        run: |
          node -e "
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const m=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)];
          if(!m.length) throw new Error('no hay script inline');
          fs.writeFileSync('/tmp/inline.js', m.map(x=>x[1]).join('\n'));
          console.log('script inline: '+m.length+' bloque(s)');
          "
          node --check /tmp/inline.js

      - name: HTML bien formado
        continue-on-error: true
        run: npx --yes html-validate@9 --formatter stylish index.html tests/test.html

      - name: La suite de Playwright
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python tests/run_tests.py

      - name: El juego arranca sin errores de consola
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python -m http.server 8202 --directory . &
          sleep 3
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          errs = []
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_context(viewport={"width": 1280, "height": 800}).new_page()
              pg.on("pageerror", lambda e: errs.append(str(e)))
              pg.on("console", lambda m: errs.append(m.text) if m.type == "error" else None)
              pg.goto("http://localhost:8202/index.html")
              pg.wait_for_timeout(6000)
              pg.evaluate("document.getElementById('play').click()")
              pg.wait_for_timeout(6000)
              ok = pg.evaluate("typeof THREE!=='undefined' && !!window.NC && !!NC.Nav && !!NC.Map")
              print("modulos cargados:", ok)
              b.close()
          print("errores de consola:", errs)
          raise SystemExit(1 if (errs or not ok) else 0)
          PY
